[workspace]
members = [
  "crates/mdstar-core",
  "crates/mdstar-render-html",
]
# The app builds on its own: it depends on a local Volt UI Kit checkout
# until the kit is published.
exclude = ["crates/mdstar-volt"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.1"
authors = ["MD Star Contributors"]

[workspace.dependencies]
emojis = "0.9.0"
latex2mathml = "0.2.3"
markdown = "1.0.0"
thiserror = "2.0.17"
