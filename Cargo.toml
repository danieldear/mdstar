[workspace]
members = [
  "crates/mdstar-core",
  "crates/mdstar-render-html",
]
# Native rendering and the app depend on the local unpublished Volt UI Kit.
# Keep core/HTML library CI independent of that private checkout.
exclude = ["crates/mdstar-volt", "crates/mdstar-render-volt"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.1"
authors = ["MD Star Contributors"]

[workspace.dependencies]
emojis = "0.9.0"
latex2mathml = "0.2.3"
markdown = "1.0.0"
thiserror = "2.0.17"
