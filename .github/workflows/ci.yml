name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Match the exact toolkit revision in both native Cargo manifests.
  VOLT_UI_KIT_REF: e07095530890019a5c6ee7b6c7972604e526523f

jobs:
  rust:
    name: Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Release signing regression tests
        run: python3 -B -m unittest discover -s tests/release -v

  app:
    name: App (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/mdstar-volt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mdstar-volt

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release signing regression tests (macOS)
        working-directory: .
        run: python3 -B -m unittest discover -s tests/release -v

      - name: Install cargo volt
        run: cargo install --locked --git https://github.com/danieldear/volt-ui-kit.git --rev "$VOLT_UI_KIT_REF" --features dev-tools --bin cargo-volt

      # Ad-hoc signed: checks the bundle, its document types and the Quick
      # Look extension build and assemble.
      - name: Bundle
        run: cargo volt bundle
