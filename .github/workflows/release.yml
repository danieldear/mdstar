name: Release

# Push a tag such as v0.1.0 (matching crates/mdstar-volt's version) to build,
# sign, notarize and staple MD Star and attach its disk image to a draft
# GitHub release. Run it by hand to build without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VOLT_UI_KIT_REF: a9f6163db29b8ca49e1914dd58dd8e2cef577ed5
  TEAM_ID: A822K85XUW

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/mdstar-volt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in crates/mdstar-volt/Cargo.toml"
            exit 1
          fi

      - name: Fetch Volt UI Kit
        working-directory: .
        env:
          TOKEN: ${{ secrets.VOLT_UI_KIT_TOKEN }}
        run: |
          kit="$GITHUB_WORKSPACE/../rust/volt-ui-kit"
          git clone --filter=blob:none "https://x-access-token:${TOKEN}@github.com/danieldear/volt-ui-kit.git" "$kit"
          git -C "$kit" checkout --detach "$VOLT_UI_KIT_REF"
          git -C "$kit" remote set-url origin https://github.com/danieldear/volt-ui-kit.git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo volt
        run: cargo install --locked --path "$GITHUB_WORKSPACE/../rust/volt-ui-kit" --features dev-tools --bin cargo-volt

      # A throwaway keychain holds the Developer ID certificate and the
      # notarization credentials for this run only.
      - name: Set up signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash "$GITHUB_WORKSPACE/scripts/setup-macos-signing.sh"

      - name: Build, sign, notarize and staple
        run: cargo volt release

      - name: Verify stapled artifacts
        run: |
          codesign --verify --deep --strict --verbose=2 "target/release/bundle/MD Star.app"
          xcrun stapler validate "target/release/bundle/MD Star.app"
          for image in target/release/bundle/MD-Star-*.dmg; do
            xcrun stapler validate "$image"
          done

      - name: Checksum
        run: |
          cd target/release/bundle
          shasum -a 256 MD-Star-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: MD-Star-macos
          path: |
            crates/mdstar-volt/target/release/bundle/MD-Star-*.dmg
            crates/mdstar-volt/target/release/bundle/SHA256SUMS.txt

      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "MD Star ${GITHUB_REF_NAME#v}" --generate-notes \
            target/release/bundle/MD-Star-*.dmg target/release/bundle/SHA256SUMS.txt

      - name: Remove the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
