name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

# macOS ships the native SwiftUI reader (MD Star.app, with the `md` CLI embedded
# in the bundle). Every platform ships the standalone `md` binary, which is both
# the terminal viewer and the TUI editor.
#
# Signing is optional: set the MACOS_* / NOTARY_* secrets to produce a
# Gatekeeper-ready build. Without them the DMG is ad-hoc signed and users must
# right-click > Open on first launch.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS — native app (universal) + md CLI ──────────────────────────────
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Store notarization credentials
        if: env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials mdstar \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build native app + DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_APPLE_ID != '' && 'mdstar' || '' }}
        run: ./script/package_macos.sh --arch universal --dmg

      - name: Package CLI binary
        run: |
          BIN="dist/MD Star.app/Contents/MacOS/md"
          ARCHIVE="md-${{ github.ref_name }}-universal-apple-darwin.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" md
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            md-*.tar.gz
            md-*.tar.gz.sha256

  # ── Linux — md CLI ───────────────────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The `md` binary links Tauri, so the GUI toolchain is required to compile
      # it even though this job ships only the terminal binary.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Build md
        run: cargo build --release -p mdstar-app --bin md --target ${{ matrix.target }}

      - name: Package CLI binary
        run: |
          BIN=target/${{ matrix.target }}/release/md
          ARCHIVE=md-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BIN)" md
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            md-*.tar.gz
            md-*.tar.gz.sha256

  # ── Windows — md CLI ─────────────────────────────────────────────────────
  windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build md
        run: cargo build --release -p mdstar-app --bin md

      - name: Package CLI binary
        shell: pwsh
        run: |
          $archive = "md-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "target\release\md.exe" -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash | Out-File "$archive.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            md-*.zip
            md-*.zip.sha256
