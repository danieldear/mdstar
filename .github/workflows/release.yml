name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

# macOS-only for now. The release ships the native SwiftUI reader as a universal
# DMG with the `md` CLI embedded in the bundle, plus a standalone `md` archive.
# Linux and Windows builds are deferred; the `md` binary still links Tauri, so
# those targets need the GTK/WebKit toolchain and have not been validated here.
#
# Signing is optional: set the MACOS_* / NOTARY_* secrets to produce a
# Gatekeeper-ready build. Without them the DMG is ad-hoc signed and users must
# right-click > Open on first launch.

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Store notarization credentials
        if: env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials mdstar \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build native app + DMG installer
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_APPLE_ID != '' && 'mdstar' || '' }}
        run: ./script/package_macos.sh --arch universal --dmg

      - name: Package CLI binary
        run: |
          BIN="dist/MD Star.app/Contents/MacOS/md"
          ARCHIVE="md-${{ github.ref_name }}-universal-apple-darwin.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" md
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            md-*.tar.gz
            md-*.tar.gz.sha256
