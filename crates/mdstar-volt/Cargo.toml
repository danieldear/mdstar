[package]
name = "mdstar-volt"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "MD Star reader drawn natively with Volt UI Kit"
publish = false

# Standalone until Volt UI Kit is published: it depends on a local checkout of
# the kit, so it stays outside the main workspace and its CI.
[workspace]

[[bin]]
name = "mdstar-volt"
path = "src/main.rs"

[dependencies]
mdstar-core = { path = "../mdstar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
volt-ui-kit = { path = "../../../rust/volt-ui-kit", features = ["native-gpu", "native-desktop"] }

# Finder "Open With" and double-click: AppKit hands the app file URLs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSAttributedString", "NSGeometry", "NSObject"] }
# Native context menus with Look Up, Share, Speech and Services.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSColor", "NSColorSpace", "NSEvent", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSSharingService", "NSSpeechSynthesizer", "NSView", "NSWindow"] }

[profile.dev.package."*"]
opt-level = 3
