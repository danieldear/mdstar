[package]
name = "mdstar-render-volt"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared native Markdown rendering for MD Star and Volt Editor"
publish = false

# Standalone shared crate; external toolkit code is fetched at an exact Git revision.
[workspace]
resolver = "2"

[features]
default = []
diagrams = ["dep:mermaid-text", "dep:mermaid-rs-renderer", "dep:resvg"]

[dependencies]
mdstar-core = { path = "../mdstar-core" }
volt-ui-kit = { git = "https://github.com/danieldear/volt-ui-kit.git", rev = "ca012dd28bb60645b5baaa57efd6f846fb1b0b8e", default-features = false, features = ["rust-ui"] }

mermaid-text = { version = "=0.16.8", optional = true }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false, optional = true }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts"], optional = true }
